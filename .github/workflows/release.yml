name: Release

# The tag-triggered path. `publish.yml` is the primary one — a version bump landing on `main`
# publishes, tags and releases in one run — and this exists for a tag pushed by hand.
#
# ## The order of the steps is the point
#
# This file used to create the GitHub Release BEFORE the publish step, and the publish step skipped
# itself when NPM_TOKEN was absent. The result, in production: v1.0.0 and v1.0.1 both ran GREEN,
# both produced a public GitHub Release with attached assets, and neither reached npm. `stockbit-mcp`
# has still never been published. A green run that announces something nobody can install is the
# worst outcome this pipeline can produce, so:
#
#   - the publish happens FIRST and the Release is the LAST thing in the job;
#   - a publish that is NEEDED but impossible is a hard failure, never a skip. Skipping is correct
#     only when the registry already has the version, which is the one case where there is genuinely
#     nothing left to do.

on:
  push:
    tags: ["v*"]

concurrency:
  # SHARED WITH publish.yml, byte for byte. `npm version patch && git push --follow-tags` delivers
  # the commit and the tag in the same moment with the USER's credential, so the GITHUB_TOKEN
  # recursion guard does not apply and both workflows start. Both would see "not published" and both
  # would publish; the loser gets E403 on a release that in fact succeeded. Serialised, the second
  # re-runs its check afterwards and correctly observes the version as published.
  group: publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      STOCKBIT_NO_BROWSER: "1"
      STOCKBIT_FORCE_FILE_STORE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: The tag must be the version in package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
          # Validated before it is written to $GITHUB_ENV, which is parsed as `key=value` lines: an
          # unchecked value containing a newline defines a second variable of the writer's choosing.
          # The class is what npm allows in a version and nothing else.
          case "$pkg" in
            "" | *[!0-9A-Za-z.+-]*)
              echo "::error::version '$pkg' has characters outside [0-9A-Za-z.+-]. Refusing to use it." >&2
              exit 1 ;;
          esac
          echo "VERSION=$pkg" >> "$GITHUB_ENV"

      # Guard against a DOUBLE publish, not just a missing token.
      #
      # `publish.yml` publishes on a version bump landing on `main`, and it pushes the matching tag
      # when it does. A tag arriving here is therefore no longer proof that this version still needs
      # publishing — it may be the tag that workflow just created. Only the registry knows, so ask
      # it, and skip cleanly when the answer is "already there".
      #
      # A tag push made with GITHUB_TOKEN does not itself start another workflow, so today the two
      # paths cannot collide that way. This does not rely on that: the recursion guard is a GitHub
      # behaviour a later switch to a PAT would silently remove, and the shared concurrency group
      # above covers the collision it never applied to in the first place.
      #
      # THREE outcomes, not two: `scripts/npm-version-state.mjs` prints a word and reserves a
      # non-zero exit for "could not determine", which `set -e` turns into a failed job. The inline
      # check this replaces read "not published" out of ANY non-zero exit, so a malformed response
      # or an unreadable temp file voted to PUBLISH.
      - name: Is this version still unpublished?
        id: registry
        run: |
          set -euo pipefail
          state="$(node scripts/npm-version-state.mjs)"
          case "$state" in
            present)
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is already on npm — publish.yml got here first. Skipping the publish." ;;
            absent)
              echo "needed=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::npm-version-state printed '$state', which is neither present nor absent." >&2
              exit 1 ;;
          esac

      # A missing token is an ERROR when a publish is needed. Skipping instead is the defect that
      # produced two green releases of nothing. It runs before the gates for the same reason
      # publish.yml's copy does: prove the unworkaroundable thing before spending twenty minutes.
      - name: The publish token must exist when a publish is needed
        if: steps.registry.outputs.needed == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::$VERSION is not on npm, but the NPM_TOKEN secret is not set, so this tag cannot be released. Add it under Settings → Secrets and variables → Actions, then re-run this workflow." >&2
            exit 1
          fi
          echo "NPM_TOKEN is present."

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run check:pack

      # `npm pack` runs prepack (clean plus tsc), so this is the build that ships.
      - name: Pack the tarball that will be published
        run: |
          set -euo pipefail
          npm pack
          if [ ! -f "stockbit-mcp-${VERSION}.tgz" ]; then
            echo "::error::npm pack did not produce stockbit-mcp-${VERSION}.tgz" >&2
            ls -1 ./*.tgz >&2 || true
            exit 1
          fi

      # The TARBALL PATH, not the directory: npm runs prepack and prepublishOnly for a directory spec
      # only (`lib/commands/publish.js`: `if (spec.type === 'directory' && !ignoreScripts)`), so
      # publishing from the directory built a SECOND, independent tarball — the `.tgz` on the Release
      # was not the `.tgz` on npm, and the provenance attestation covered only npm's. One artefact,
      # built once, attested, published and attached.
      - name: Publish to npm
        if: steps.registry.outputs.needed == 'true'
        run: npm publish "./stockbit-mcp-${VERSION}.tgz" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build the Desktop Extension
        run: node scripts/build-mcpb.mjs

      # LAST. A Release is public and announces something installable; nothing may create one until
      # the thing it announces is on npm. Reaching this line means either the publish above
      # succeeded or the registry already had the version.
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            stockbit-mcp-*.tgz
            stockbit-mcp-*.mcpb

  registry:
    name: MCP Registry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mcp-publisher authenticates as this repository over OIDC
    steps:
      - uses: actions/checkout@v7

      # Pinned for the same reason the job above pins it: this job now runs
      # `scripts/mcp-registry-version-state.mjs`, which uses global `fetch` and
      # `AbortSignal.timeout`. The runner's default Node is not part of this repository's contract.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # ASK BEFORE PUBLISHING — the same question the npm step in the job above has always asked,
      # and the half of the pipeline that was missing it. THIS workflow is the one that observed the
      # failure. `npm version <bump> && git push --follow-tags` starts publish.yml and release.yml
      # together; the shared concurrency group serialises them; publish.yml gets there first and
      # publishes to both registries; this workflow then correctly SKIPS the npm publish, still
      # succeeds, and its `registry` job — which asked nothing — re-published and was refused:
      #
      #   Error: publish failed: server returned status 400: {"errors":[{"message":"invalid version:
      #   cannot publish duplicate version"}]}
      #
      # `server.json` is read rather than the tag or package.json because `server.json` is the
      # document `mcp-publisher` sends; `test/distribution.test.ts` pins all three equal.
      #
      # UNDETERMINED DOES NOT SKIP, the deliberate opposite of the npm gate above. There a wrong
      # answer publishes something irreversible; here a wrong `present` silently omits a version
      # from the registry, which is the failure mode this pipeline is written to forbid. A needless
      # re-attempt costs one refused request, so anything short of a definite `present` publishes.
      - name: Is this version already in the MCP Registry?
        id: mcp_registry
        run: |
          set -euo pipefail
          published="$(node -p "require('./server.json').version")"
          server_name="$(node -p "require('./server.json').name")"
          # Validate BEFORE it reaches $GITHUB_OUTPUT, for the reason publish.yml's `decide` job
          # spells out: that file is parsed as `key=value` lines, so a value carrying a newline
          # defines a SECOND key of the writer's choosing — here `needed=false`, which would skip
          # the publish and report success. The character class is what a version may contain.
          case "$published" in
            "" | *[!0-9A-Za-z.+-]*)
              echo "::error::server.json version is empty or has characters outside [0-9A-Za-z.+-]. Refusing to use it." >&2
              exit 1 ;;
          esac
          echo "version=$published" >> "$GITHUB_OUTPUT"
          # Both are passed explicitly rather than left to the script's own default: the script
          # resolves `server.json` relative to ITSELF while this step reads it relative to the
          # working directory, and the two would diverge the moment anyone set `working-directory:`
          # on the job — leaving the annotation naming a version the query never asked about.
          #
          # `|| state=""` rather than letting `set -e` end the job: exit 2 means "could not
          # determine", and the policy above turns that into a publish, not a failure.
          state="$(node scripts/mcp-registry-version-state.mjs --name "$server_name" --version "$published")" || state=""
          case "$state" in
            present)
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$published is already in the MCP Registry — publish.yml got here first. Skipping the publish." ;;
            absent)
              echo "needed=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "::warning::could not determine whether $published is in the MCP Registry (reason above). Publishing anyway — a duplicate is refused harmlessly and tolerated." ;;
          esac

      # Downloaded only when there is something to publish. When the check above says the version is
      # already there this job has nothing left to do, and spending a github.com round trip it can
      # FAIL on would turn a no-op into a red run — which is the failure this change exists to close.
      - name: Install mcp-publisher
        if: steps.mcp_registry.outputs.needed == 'true'
        run: |
          set -euo pipefail
          asset="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz"
          # Downloaded to a file rather than piped into tar: in a pipeline curl's exit status is not
          # the one the shell reports, and without --fail a 404 HTML page is happily fed to tar. The
          # retries are for a DNS or TLS blip, which would otherwise end the run on a bare exit code
          # with no annotation saying what to do about it.
          if ! curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
                 -o /tmp/mcp-publisher.tar.gz \
                 "https://github.com/modelcontextprotocol/registry/releases/latest/download/$asset"; then
            echo "::error::could not download $asset. The npm package IS live; re-run this job once github.com is reachable." >&2
            exit 1
          fi
          tar xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      # No NPM_TOKEN condition any more. The job above now FAILS rather than skipping when a needed
      # publish is impossible, so reaching this point means the npm package with the matching
      # `mcpName` is live — the only precondition the MCP Registry has. Gating on the token instead
      # used to skip this silently for a version publish.yml had already put on npm.
      - name: Publish server.json
        if: steps.mcp_registry.outputs.needed == 'true'
        env:
          MCP_VERSION: ${{ steps.mcp_registry.outputs.version }}
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc

          # The step above closes the ordinary case. This closes the RACE, which checking harder
          # cannot: publish.yml can publish in the gap between that query and this command. The
          # registry's own refusal is the only authority on what is already there, so the ONE error
          # that means "the end state you asked for already holds" is read as success. Everything
          # else — a malformed server.json, a rejected OIDC login, an unreachable registry — still
          # fails the job. The match is on the registry's exact wording rather than on the 400,
          # which also covers server.json being wrong.
          if ./mcp-publisher publish 2>&1 | tee /tmp/mcp-publish.log; then
            exit 0
          fi
          if grep -q "cannot publish duplicate version" /tmp/mcp-publish.log; then
            echo "::notice::$MCP_VERSION reached the MCP Registry from publish.yml while this job was running. Treating as published."
            exit 0
          fi
          echo "::error::mcp-publisher failed for a reason other than a duplicate version. The log is above." >&2
          exit 1
