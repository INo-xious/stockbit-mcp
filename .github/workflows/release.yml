name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      STOCKBIT_NO_BROWSER: "1"
      STOCKBIT_FORCE_FILE_STORE: "1"
      # `secrets` cannot be used in a job-level `if:`, so it is read into the
      # environment and the steps below branch on the string.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: The tag must be the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run check:pack

      - name: Pack the tarball
        run: npm pack

      - name: Build the Desktop Extension
        run: node scripts/build-mcpb.mjs

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stockbit-mcp-*.tgz
            stockbit-mcp-*.mcpb

      # The first publish is done by hand by the account owner. After that,
      # setting NPM_TOKEN turns this on; without it the step is skipped, not failed.
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  registry:
    name: MCP Registry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        if: env.HAS_NPM_TOKEN == 'true'
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      # Publishing to the registry only makes sense once the npm package with the
      # matching `mcpName` is live, which is why this needs the job above.
      - name: Publish server.json
        if: env.HAS_NPM_TOKEN == 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
