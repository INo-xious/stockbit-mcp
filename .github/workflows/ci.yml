name: CI

on:
  push:
    branches: [main, marvel-testing]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    env:
      # No job on a runner may open a browser window or reach a real keychain.
      STOCKBIT_NO_BROWSER: "1"
      STOCKBIT_FORCE_FILE_STORE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke — start the built binary and ask what it registered
        run: npm run smoke

      - name: Check the publish manifest
        run: npm run check:pack

      - name: docs/TOOLS.md is generated, so it must not be stale
        run: npm run docs:tools

      - name: Fail if regenerating it changed anything
        run: git diff --exit-code docs/TOOLS.md

  audit:
    name: audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every relative link in the docs resolves
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            README.md README.id.md CONTRIBUTING.md CONTEXT.md
            SECURITY.md CODE_OF_CONDUCT.md CLAUDE.md CHANGELOG.md
            'docs/**/*.md'
          fail: true
